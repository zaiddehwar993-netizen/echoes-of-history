name: Auto Historical Blog Publisher

on:
  schedule:
    # Runs once a day at 14:00 UTC = 7:00 PM Pakistan Time (PKT, UTC+5)
    # Prime time when most readers are free/active in the evening.
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  publish-blog:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests google-genai

    - name: Run Gemini Blog Generator
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: python generate_blog.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Automated daily historical blog by Gemini AI" || exit 0
        git push
