<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Articles - Echoes of History</title>
    <meta name="description" content="Explore historical chronicles - from ancient empires to Islamic Golden Age scholars. Search and browse articles by category.">
    <link rel="stylesheet" href="style.css?v=2.0">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>

    <style>
        /* ===== Premium Search Bar ===== */
        .search-box-pro {
            position: relative;
            max-width: 420px;
            width: 100%;
        }
        .search-box-pro .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #d4af37;
            font-size: 1rem;
            pointer-events: none;
            transition: 0.3s;
        }
        .search-box-pro input {
            width: 100%;
            background: linear-gradient(145deg, #131313, #0e0e0e);
            border: 1px solid #2a2a2a;
            color: #f4f4f4;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            padding: 14px 46px 14px 46px;
            border-radius: 50px;
            transition: all 0.35s ease;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
        }
        .search-box-pro input::placeholder {
            color: #777;
        }
        .search-box-pro input:hover {
            border-color: #444;
        }
        .search-box-pro input:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.12), 0 4px 18px rgba(212, 175, 55, 0.15);
            background: #151515;
        }
        .search-box-pro input:focus + .search-icon,
        .search-box-pro.has-text .search-icon {
            color: #f0c94a;
            transform: translateY(-50%) scale(1.1);
        }
        .search-clear-btn {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #666;
            font-size: 0.95rem;
            cursor: pointer;
            display: none;
            padding: 4px;
            transition: color 0.2s;
        }
        .search-clear-btn:hover {
            color: #d4af37;
        }
        .search-box-pro.has-text .search-clear-btn {
            display: block;
        }
        .search-result-count {
            font-size: 0.78rem;
            color: #888;
            margin-top: 8px;
            padding-left: 20px;
            min-height: 16px;
        }
        .search-result-count strong {
            color: #d4af37;
        }

        @media (max-width: 600px) {
            .search-box-pro { max-width: 100%; }
        }

        /* Category Filter Pills */
        .category-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin: 1.5rem 0 2.5rem;
        }
        .filter-pill {
            background: #151515;
            border: 1px solid #2a2a2a;
            color: #ccc;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.25s;
            white-space: nowrap;
        }
        .filter-pill:hover {
            border-color: #d4af37;
            color: #d4af37;
        }
        .filter-pill.active {
            background: #d4af37;
            color: #0a0a0a;
            border-color: #d4af37;
            font-weight: 600;
        }

        /* NEW badge */
        .new-badge {
            display: inline-block;
            background: #d4af37;
            color: #0a0a0a;
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 1px;
            padding: 3px 9px;
            border-radius: 20px;
            margin-left: 8px;
            vertical-align: middle;
        }

        /* Reading time */
        .reading-time {
            color: #888;
            font-size: 0.78rem;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-top: 10px;
        }

        /* Loading / Empty state */
        .articles-status {
            grid-column: 1 / -1;
            text-align: center;
            color: #888;
            padding: 3rem 1rem;
            font-size: 0.95rem;
        }
        .articles-status i {
            display: block;
            font-size: 1.8rem;
            margin-bottom: 12px;
            color: #d4af37;
        }

        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        @media (max-width: 600px) {
            .category-filters {
                overflow-x: auto;
                flex-wrap: nowrap;
                padding-bottom: 6px;
            }
        }
    </style>
</head>
<body>

    <header>
        <nav class="navbar">
            <div class="logo">ECHOES OF <span>HISTORY</span></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="articles.html" class="active">Articles</a></li>
                <li><a href="impact.html">Impact</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <section class="articles-container" style="padding-top: 4rem; padding-bottom: 4rem;">
        <div class="section-header">
            <h2 class="section-title">Historical Chronicles</h2>
            <div class="search-box-pro" id="searchBoxPro">
                <i class="fas fa-magnifying-glass search-icon"></i>
                <input type="text" id="searchInput" placeholder="Search by title, era, or topic...">
                <button class="search-clear-btn" id="searchClearBtn" type="button" aria-label="Clear search">
                    <i class="fas fa-xmark"></i>
                </button>
            </div>
        </div>
        <div class="search-result-count" id="searchResultCount"></div>

        <div class="category-filters" id="categoryFilters">
            <button class="filter-pill active" data-category="all">All</button>
        </div>

        <div class="articles-grid" id="articlesGrid">
            <div class="articles-status"><i class="fas fa-spinner fa-spin"></i> Loading articles...</div>
        </div>
    </section>

    <a href="https://wa.me/923108604886" target="_blank" class="floating-contact-btn">
        <i class="fab fa-whatsapp"></i> <span>Hire Me</span>
    </a>

    <footer>
        <p>&copy; 2026 Echoes of History. Developed by Zaid.</p>
    </footer>

    <script src="script.js"></script>
    <script>
        let allArticles = [];
        let currentCategory = 'all';
        let currentSearch = '';

        function estimateReadingTime(content) {
            if (!content) return 3;
            const text = content.replace(/<[^>]*>/g, ' ');
            const words = text.trim().split(/\s+/).length;
            return Math.max(1, Math.ceil(words / 200));
        }

        function buildCategoryFilters() {
            const filterBox = document.getElementById('categoryFilters');
            const categories = new Set();
            allArticles.forEach(a => categories.add(a.category || a.tag || 'History'));

            filterBox.innerHTML = '<button class="filter-pill active" data-category="all">All</button>' +
                Array.from(categories).map(cat =>
                    `<button class="filter-pill" data-category="${cat}">${cat}</button>`
                ).join('');

            filterBox.querySelectorAll('.filter-pill').forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBox.querySelectorAll('.filter-pill').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentCategory = btn.getAttribute('data-category');
                    renderGrid();
                });
            });
        }

        function renderGrid() {
            const grid = document.getElementById('articlesGrid');
            const countBox = document.getElementById('searchResultCount');
            const query = currentSearch.toLowerCase();

            let filtered = allArticles.filter(article => {
                const cat = article.category || article.tag || 'History';
                const matchesCategory = currentCategory === 'all' || cat === currentCategory;
                const matchesSearch = !query ||
                    (article.title || '').toLowerCase().includes(query) ||
                    cat.toLowerCase().includes(query) ||
                    (article.description || article.summary || '').toLowerCase().includes(query);
                return matchesCategory && matchesSearch;
            });

            if (query) {
                countBox.innerHTML = `<strong>${filtered.length}</strong> result${filtered.length !== 1 ? 's' : ''} found`;
            } else {
                countBox.innerHTML = '';
            }

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="articles-status"><i class="fas fa-magnifying-glass"></i> No articles found. Try a different search or category.</div>`;
                return;
            }

            grid.innerHTML = filtered.map((article) => {
                const isNew = allArticles.indexOf(article) === 0;
                const readingTime = estimateReadingTime(article.content);
                return `
                <article class="article-card">
                    <div class="card-img-wrapper">
                        <img src="${article.image}" alt="${article.title}" loading="lazy">
                    </div>
                    <div class="card-body">
                        <span class="category-tag">${article.category || article.tag || 'History'}</span>
                        <h3>${article.title}${isNew ? '<span class="new-badge">NEW</span>' : ''}</h3>
                        <p>${article.description || article.summary || 'Explore this historical event in detail.'}</p>
                        <div class="reading-time"><i class="far fa-clock"></i> ${readingTime} min read</div>
                        <a href="${article.link || 'blog-detail.html'}" class="read-btn">
                            <span>Read Article</span> <i class="fas fa-arrow-right"></i>
                        </a>
                    </div>
                </article>`;
            }).join('');
        }

        async function loadArticlesPage() {
            const grid = document.getElementById('articlesGrid');
            try {
                const response = await fetch('./blogs.json');
                if (response.ok) {
                    const data = await response.json();
                    if (Array.isArray(data) && data.length > 0) {
                        allArticles = data;
                        buildCategoryFilters();
                        renderGrid();
                        return;
                    }
                }
                grid.innerHTML = `<div class="articles-status"><i class="fas fa-book"></i> No articles published yet. Check back soon!</div>`;
            } catch (error) {
                console.error('Error loading articles:', error);
                grid.innerHTML = `<div class="articles-status"><i class="fas fa-triangle-exclamation"></i> Unable to load articles right now.</div>`;
            }
        }

        const searchInput = document.getElementById('searchInput');
        const searchBoxPro = document.getElementById('searchBoxPro');
        const searchClearBtn = document.getElementById('searchClearBtn');

        searchInput.addEventListener('input', (e) => {
            currentSearch = e.target.value;
            searchBoxPro.classList.toggle('has-text', currentSearch.length > 0);
            renderGrid();
        });

        searchClearBtn.addEventListener('click', () => {
            searchInput.value = '';
            currentSearch = '';
            searchBoxPro.classList.remove('has-text');
            renderGrid();
            searchInput.focus();
        });

        document.addEventListener('DOMContentLoaded', loadArticlesPage);
    </script>
</body>
</html>
