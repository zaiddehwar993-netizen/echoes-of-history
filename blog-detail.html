    <script>
        let currentBlogGlobal = null;
        let allBlogsGlobal = [];
        let currentFontSize = 1.1;

        async function loadSingleArticle() {
            const urlParams = new URLSearchParams(window.location.search);
            const articleTitle = urlParams.get('title');

            try {
                const response = await fetch('blogs.json');
                if (response.ok) {
                    const blogs = await response.json();
                    allBlogsGlobal = blogs;

                    let currentBlog = blogs[0];
                    if (articleTitle) {
                        const found = blogs.find(b => b.title.toLowerCase() === decodeURIComponent(articleTitle).toLowerCase());
                        if (found) currentBlog = found;
                    }

                    if (currentBlog) {
                        currentBlogGlobal = currentBlog;
                        renderArticle(currentBlog, blogs);
                    }
                }
            } catch (error) {
                console.error("Error loading article detail:", error);
                document.getElementById('article-body').innerHTML = "<p>Failed to load the article content.</p>";
            }
        }

        function renderArticle(currentBlog, blogs) {
            // Title & meta tags
            document.title = currentBlog.title + " - Echoes of History";
            document.getElementById('page-title').textContent = currentBlog.title + " - Echoes of History";
            document.getElementById('article-title').textContent = currentBlog.title;
            document.getElementById('article-category').textContent = currentBlog.category || currentBlog.tag || 'History';
            document.getElementById('article-image').src = currentBlog.image;
            document.getElementById('breadcrumb-current').textContent = currentBlog.title;

            const desc = (currentBlog.description || currentBlog.excerpt || currentBlog.content || '').replace(/<[^>]*>/g, '').slice(0, 155);
            document.getElementById('meta-description').setAttribute('content', desc);
            document.getElementById('og-title').setAttribute('content', currentBlog.title);
            document.getElementById('og-description').setAttribute('content', desc);
            document.getElementById('og-image').setAttribute('content', currentBlog.image || '');

            // Date
            const dateStr = currentBlog.date || currentBlog.publishedDate;
            document.getElementById('article-date').textContent = dateStr ? new Date(dateStr).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : 'Recently published';

            // Body content
            const bodyBox = document.getElementById('article-body');
            let contentHTML;
            if (currentBlog.content.includes('<p>') || currentBlog.content.includes('<h2>')) {
                contentHTML = currentBlog.content;
            } else {
                contentHTML = `<p>${currentBlog.content.replace(/\n\n/g, '</p><p>')}</p>`;
            }
            bodyBox.innerHTML = contentHTML;

            // Reading time (based on plain text word count)
            const plainText = bodyBox.textContent || '';
            const wordCount = plainText.trim().split(/\s+/).length;
            const readTime = Math.max(1, Math.ceil(wordCount / 200));
            document.getElementById('article-read-time').textContent = readTime + ' min read';

            // Table of contents from h2/h3 inside article body
            buildTableOfContents(bodyBox);

            // Share buttons
            setupShareButtons(currentBlog);

            // Related articles
            buildRelatedArticles(currentBlog, blogs);

            // Prev / Next
            buildPrevNext(currentBlog, blogs);
        }

        function buildTableOfContents(bodyBox) {
            const headings = bodyBox.querySelectorAll('h2, h3');
            const tocBox = document.getElementById('table-of-contents');
            const tocList = document.getElementById('toc-list');
            tocList.innerHTML = '';

            if (headings.length < 2) {
                tocBox.style.display = 'none';
                return;
            }

            headings.forEach((heading, i) => {
                const id = 'section-' + i;
                heading.id = id;
                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = '#' + id;
                a.textContent = heading.textContent;
                li.appendChild(a);
                tocList.appendChild(li);
            });
            tocBox.style.display = 'block';
        }

        function setupShareButtons(currentBlog) {
            const url = window.location.href;
            const title = currentBlog.title;

            document.getElementById('share-whatsapp').href = `https://wa.me/?text=${encodeURIComponent(title + ' - ' + url)}`;
            document.getElementById('share-twitter').href = `https://twitter.com/intent/tweet?text=${encodeURIComponent(title)}&url=${encodeURIComponent(url)}`;
            document.getElementById('share-facebook').href = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`;

            document.getElementById('share-copy').addEventListener('click', function() {
                navigator.clipboard.writeText(url).then(() => {
                    const btn = document.getElementById('share-copy');
                    btn.classList.add('copied');
                    btn.innerHTML = '<i class="fa-solid fa-check"></i>';
                    setTimeout(() => {
                        btn.classList.remove('copied');
                        btn.innerHTML = '<i class="fa-solid fa-link"></i>';
                    }, 1800);
                });
            });
        }

        function buildRelatedArticles(currentBlog, blogs) {
            const cat = currentBlog.category || currentBlog.tag;
            const related = blogs.filter(b => b.title !== currentBlog.title && (b.category || b.tag) === cat).slice(0, 3);
            const finalList = related.length > 0 ? related
