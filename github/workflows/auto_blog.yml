name: Auto Historical Blog Publisher

on:
  schedule:
    # Subah 5:00 AM PKT (12:00 AM UTC) & Shaam 7:00 PM PKT (02:00 PM UTC)
    - cron: '0 0,14 * * *'
  workflow_dispatch: # Manual test run ke liye

jobs:
  publish-blog:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Run DeepSeek Blog Generator
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      run: python generate_blog.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Automated daily historical blog by DeepSeek AI" || exit 0
        git push
        
